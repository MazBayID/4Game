name: Build Android APK

on:
  # APK builds are manual; CI builds and publishes the debug artifact once per change.
  workflow_dispatch:
    inputs:
      build_type:
        description: "Android build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      version_code:
        description: "Android versionCode"
        required: false
        default: "1"
        type: string
      version_name:
        description: "Android versionName"
        required: false
        default: "1.0.0"
        type: string

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      VERSION_CODE: ${{ inputs.version_code || '1' }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle assembleRelease -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"
          else
            gradle assembleDebug -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME="$VERSION_NAME"
          fi

      - name: Collect APK Artifact
        run: |
          mkdir -p apk-output
          APK_PATH=$(find "app/build/outputs/apk/$BUILD_TYPE" -name "*.apk" -print -quit)
          test -n "$APK_PATH"
          APK_NAME="ByteGhost-The-Synthex-Files-v$VERSION_NAME-$BUILD_TYPE.apk"
          cp "$APK_PATH" "apk-output/$APK_NAME"
          ls -lh apk-output/
          sha256sum apk-output/*.apk > apk-output/SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteGhost-The-Synthex-Files-${{ env.VERSION_NAME }}-${{ env.BUILD_TYPE }}
          path: apk-output/
          if-no-files-found: error
