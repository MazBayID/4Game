name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Android build variant"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      version_code:
        description: "Android versionCode"
        required: false
        default: "1"
        type: string
      version_name:
        description: "Android versionName"
        required: false
        default: "1.0.0"
        type: string

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            gradle assembleRelease -PVERSION_CODE=${{ inputs.version_code }} -PVERSION_NAME=${{ inputs.version_name }}
          else
            gradle assembleDebug -PVERSION_CODE=${{ inputs.version_code }} -PVERSION_NAME=${{ inputs.version_name }}
          fi

      - name: Collect APK Artifact
        run: |
          mkdir -p apk-output
          find app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/ \;
          ls -lh apk-output/
          sha256sum apk-output/*.apk > apk-output/SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neo-null-protocol-${{ inputs.build_type }}-apk
          path: apk-output/
          if-no-files-found: error
