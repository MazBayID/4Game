name: Android Validation

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, python-runtime-poc]
  pull_request:
    branches: [main]

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test Python runtime helper
        run: PYTHONPATH=runner/src/main/python python -m unittest discover -s tests/python -v

      - name: Compile native Android debug APK
        run: gradle assembleDebug

      - name: Collect debug APK artifact
        run: |
          mkdir -p apk-output
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -print -quit)
          test -n "$APK_PATH"
          RUNNER_APK_PATH=$(find runner/build/outputs/apk/debug -name "*.apk" -print -quit)
          test -n "$RUNNER_APK_PATH"
          cp "$APK_PATH" apk-output/ByteGhost-The-Synthex-Files-debug.apk
          cp "$RUNNER_APK_PATH" apk-output/ByteGhost-Python-Runner-debug.apk
          sha256sum apk-output/*.apk > apk-output/SHA256SUMS.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteGhost-debug-${{ github.sha }}
          path: apk-output/
          if-no-files-found: error

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run ordered CPython, Binder, and asset tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash .github/scripts/run-runtime-instrumentation.sh
