name: ByteGhost APK Integration Check

concurrency:
  group: byteghost-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_runtime_tests:
        description: "Run Python unit tests and Android instrumentation on an emulator"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build unified ByteGhost APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build the single application APK
        run: gradle :app:assembleDebug

      - name: Verify APK identity and output count
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | wc -l)
          test "$APK_COUNT" -eq 1
          APK_PATH=$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH" | grep -F "package: name='com.neonull.protocol'"

      - name: Upload unified ByteGhost APK
        uses: actions/upload-artifact@v4
        with:
          name: ByteGhost-unified-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Python and Android runtime validation
        if: github.event_name == 'workflow_dispatch' && inputs.run_runtime_tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            chmod +x .github/scripts/run-runtime-instrumentation.sh
            .github/scripts/run-runtime-instrumentation.sh
