name: Android Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test Python runtime helper
        run: PYTHONPATH=app/src/main/python python -m unittest discover -s tests/python -v

      - name: Compile native Android debug APK
        run: gradle assembleDebug

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Google ATD images are trimmed for automated testing. Compile SDK stays 35.
      - name: Run CPython + Binder instrumentation tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            echo "=== Emulator diagnostics ==="; adb devices -l; adb shell getprop ro.build.version.sdk; adb shell getprop sys.boot_completed; echo "=== Running CPython + Binder instrumentation tests ==="; gradle connectedDebugAndroidTest; test_exit=$?; echo "=== Runtime service and Android binding diagnostics ==="; adb logcat -d -v threadtime | grep -E "ByteGhostRuntimeTest|ByteGhostPythonService|ActivityManager|AndroidRuntime|SecurityException|Permission Denial" || true; exit "$test_exit"
